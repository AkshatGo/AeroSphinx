[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosphinx"
version = "0.1.0"
description = "Availability-aware multisource PM2.5 estimation and forecasting platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AkshatGo" }]
keywords = ["air-quality", "pm2.5", "aerosol-optical-depth", "merra-2", "insat-3d"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
aerosphinx = "aerosphinx.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aerosphinx = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests spanning multiple modules",
    "scientific: tests that assert scientific or data-integrity properties",
]
filterwarnings = ["error::FutureWarning"]
